name: crimereport
description: "CrImEreport - Anonymous crime reporting app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Mapping
  mapbox_maps_flutter: ^2.1.0
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Media
  video_player: ^2.8.2
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  
  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Image Processing
  flutter_cache_manager: ^3.4.1
  image: ^4.5.4
  
  # Navigation
  google_nav_bar: ^5.0.6
  
  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/markers/