name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - run: npm ci
      - run: npm test

  cdk-tests:
    name: CDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/aws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infrastructure/aws/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  flutter-checks:
    name: Flutter Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy:
    name: Deploy to Production
    needs: [backend-tests, cdk-tests, flutter-checks]
    runs-on: ubuntu-latest
    outputs:
      alb_dns: ${{ steps.alb.outputs.dns }}
    defaults:
      run:
        working-directory: infrastructure/aws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infrastructure/aws/package-lock.json

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/crimereport-github-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: CDK Deploy
        run: npx cdk deploy --all --require-approval never

      - name: Get ALB DNS
        id: alb
        run: |
          DNS=$(aws cloudformation describe-stacks \
            --stack-name CrimeReport-Compute \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text)
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Integration Tests
    needs: [deploy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - run: npm ci

      - name: Wait for ECS stabilization
        run: sleep 30

      - name: Run integration tests
        env:
          API_URL: http://${{ needs.deploy.outputs.alb_dns }}
        run: npm run test:integration
